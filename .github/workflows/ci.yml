name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # The runner's apt mirror is slow (~170 kB/s), so keep downloaded .deb files between runs.
      - name: Restore apt package cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml', 'uv.lock') }}
          restore-keys: apt-${{ runner.os }}-

      - name: Install Qt and browser system libraries
        run: |
          mkdir -p ~/.cache/apt-archives/partial
          echo "Dir::Cache::Archives \"$HOME/.cache/apt-archives/\";" | sudo tee /etc/apt/apt.conf.d/99ci-archives
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1
          uv run playwright install-deps chromium
          sudo chown -R "$USER" ~/.cache/apt-archives

      - name: Lint
        run: uv run ruff check

      - name: Type-check
        run: uv run pyright

      - name: Install browser for offline DOM regressions
        run: uv run playwright install chromium

      - name: Permit sandboxed test Chromium on AppArmor runners
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            # Chromium's documented per-executable allowance keeps its sandbox enabled:
            # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
            chromium_executable="$(uv run python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
            sudo tee /etc/apparmor.d/kusamushiri-test-chromium >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile kusamushiri-test-chromium "$chromium_executable" flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/kusamushiri-test-chromium
          fi

      - name: Run tests
        run: uv run pytest -q
